<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Project Calendar</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#fff;background:#07090d}body{padding:24px}.wrap{max-width:1100px;margin:auto}h1{font:400 48px Georgia,serif;margin:10px 0}.sub{color:#b9c0ca}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.btn,select,input{font:inherit}.btn,select{background:#171c25;color:#fff;border:1px solid #555;border-radius:10px;padding:10px 14px;cursor:pointer}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.head{text-align:center;color:#e9c46a;padding:10px}.day{min-height:100px;background:#111722;border:1px solid #29313d;border-radius:9px;padding:9px}.today{border:2px solid #e9c46a}.event{margin-top:7px;padding:6px;background:#332d1d;border-left:3px solid #e9c46a;border-radius:5px;font-size:12px}.music{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:30;background:#111722;border:1px solid #444;padding:10px;border-radius:16px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center}.music .btn{padding:7px 10px}.gallery{position:fixed;inset:0;background:#030405;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;padding:25px}.gallery.show{display:flex}.gallery img{max-width:90vw;max-height:70vh;object-fit:contain}.gallery .name{font:22px Georgia,serif;margin:12px}.controls{background:#111722;padding:12px;border-radius:14px}.exit{position:absolute;right:18px;top:18px}@media(max-width:650px){h1{font-size:34px}.day{min-height:65px;padding:6px}.music{width:96%}}</style></head><body><div class="wrap"><h1>My Project Calendar</h1><p class="sub">From Nature to Canvas • Plant cultivation • Artistic development</p><div class="toolbar"><button class="btn" id="todayBtn">Today</button><button class="btn" id="prevMonth">‹ Previous</button><button class="btn" id="nextMonth">Next ›</button><button class="btn" id="galleryBtn">🎨 Art Gallery Mode</button><button class="btn" id="addBtn">＋ Add Activity</button></div><h2 id="month"></h2><div class="calendar" id="cal"></div></div><div class="music"><button class="btn" id="prevSong">⏮</button><button class="btn" id="playSong">▶️</button><button class="btn" id="nextSong">⏭</button><select id="songSelect"><option value="0">Song 1</option><option value="1">Song 2</option><option value="2">Song 3</option></select><span>🔊</span><input id="volume" type="range" min="0" max="1" step=".01" value=".55"></div><div id="gallery" class="gallery"><button class="btn exit" id="exitGallery">✕ Exit Gallery</button><img id="art" alt="Artwork"><div class="name" id="artName"></div><div class="controls"><button class="btn" id="prevArt">⏮</button><button class="btn" id="slideBtn">▶️</button><button class="btn" id="nextArt">⏭</button> <label>Speed <input id="speed" type="range" min="2" max="15" value="6"></label></div></div><script>(function(){const $=id=>document.getElementById(id);const events=JSON.parse(localStorage.getItem('natureCanvasEvents')||'[]');let view=new Date();function render(){const y=view.getFullYear(),m=view.getMonth();$('month').textContent=view.toLocaleString('en',{month:'long',year:'numeric'});const c=$('cal');c.innerHTML='';['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(x=>{const h=document.createElement('div');h.className='head';h.textContent=x;c.appendChild(h)});const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){const e=document.createElement('div');e.className='day';e.style.visibility='hidden';c.appendChild(e)}for(let n=1;n<=days;n++){const d=document.createElement('div');d.className='day';const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(n).padStart(2,'0');if(ds===new Date().toISOString().slice(0,10))d.classList.add('today');d.innerHTML='<b>'+n+'</b>';events.filter(e=>e.date===ds).forEach(e=>{const x=document.createElement('div');x.className='event';x.textContent=e.title;d.appendChild(x)});d.onclick=()=>addEvent(ds);c.appendChild(d)}}function addEvent(date){const title=prompt('Activity / Event:');if(!title)return;const dt=date||prompt('Date (YYYY-MM-DD):');if(!dt)return;events.push({date:dt,title:title});localStorage.setItem('natureCanvasEvents',JSON.stringify(events));render()}$('todayBtn').onclick=()=>{view=new Date();render()};$('prevMonth').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('nextMonth').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('addBtn').onclick=()=>addEvent();
const base='https://raw.githubusercontent.com/LarryElijah/Art-Gallery-Online/main/';const songs=[base+'amapiano.mp3',base+'Casapiano%20%5B7JDBiyDhZI8%5D.mp3',base+'Asake%20x%20Mavo%20Amapiano%20Type%20Beat%20_%20Afrobeat%20Instrumental%202026%20_AURA%20SALAD_%20%5B0PyPdLnchLQ%5D.mp3'];let si=0;const audio=new Audio();audio.volume=.55;function loadSong(auto){audio.src=songs[si];$('songSelect').value=si;if(auto)audio.play().then(()=>$('playSong').textContent='⏸').catch(()=>{});else $('playSong').textContent='▶️'}function nextSong(){si=(si+1)%songs.length;loadSong(true)}function prevSong(){si=(si-1+songs.length)%songs.length;loadSong(true)}audio.onended=nextSong;$('playSong').onclick=()=>{if(audio.paused){audio.play().then(()=>$('playSong').textContent='⏸').catch(()=>{})}else{audio.pause();$('playSong').textContent='▶️'}};$('nextSong').onclick=nextSong;$('prevSong').onclick=prevSong;$('songSelect').onchange=e=>{si=Number(e.target.value);loadSong(true)};$('volume').oninput=e=>audio.volume=Number(e.target.value);loadSong(false);
const arts=[['IMG_0080.jpeg','Artwork 01'],['IMG_0081.jpeg','Artwork 02'],['IMG_0084.jpeg','Artwork 03']];let ai=0,slides=false,timer=null;function showArt(){$('art').src=base+arts[ai][0];$('artName').textContent=arts[ai][1]}function nextArt(){ai=(ai+1)%arts.length;showArt()}function prevArt(){ai=(ai-1+arts.length)%arts.length;showArt()}function stopSlides(){clearInterval(timer);timer=null;slides=false;$('slideBtn').textContent='▶️'}$('galleryBtn').onclick=()=>{$('gallery').classList.add('show');showArt()};$('exitGallery').onclick=()=>{$('gallery').classList.remove('show');stopSlides()};$('nextArt').onclick=nextArt;$('prevArt').onclick=prevArt;$('slideBtn').onclick=()=>{if(slides)stopSlides();else{slides=true;$('slideBtn').textContent='⏸';timer=setInterval(nextArt,Number($('speed').value)*1000)}};$('speed').oninput=()=>{if(slides){clearInterval(timer);timer=setInterval(nextArt,Number($('speed').value)*1000)}};render()})();</script></body></html>
