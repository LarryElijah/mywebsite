<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Project Calendar</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07090d;color:#f7f3ea;font-family:Arial,sans-serif}body{padding:24px}h1{font-family:Georgia,serif;font-weight:400}button,select,input{font:inherit}button,select{background:#171c25;color:#fff;border:1px solid #555;border-radius:10px;padding:10px 14px;cursor:pointer}.top{max-width:1100px;margin:auto}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:15px}.day,.head{padding:12px;border-radius:9px}.head{text-align:center;color:#e9c46a}.day{min-height:90px;background:#111722;border:1px solid #29313d}.today{border:2px solid #e9c46a}.event{margin-top:8px;padding:6px;background:#332d1d;border-left:3px solid #e9c46a;border-radius:5px;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.music{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:10;background:#111722;border:1px solid #333;padding:9px 12px;border-radius:16px;display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:center}.music button{padding:7px 10px}.gallery{position:fixed;inset:0;background:#030405;z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;padding:25px}.gallery.show{display:flex}.gallery img{max-width:90vw;max-height:72vh;object-fit:contain}.gallery .name{font:22px Georgia,serif;margin:12px}.gallery .controls{background:#111722;padding:10px;border-radius:14px}.exit{position:absolute;right:18px;top:18px}.small{color:#aeb6c2;font-size:13px}@media(max-width:650px){.day{min-height:65px;padding:6px}.head{font-size:11px;padding:6px}.event{font-size:9px}.music{width:96%}}
</style></head><body><div class="top"><h1>My Project Calendar</h1><p class="small">From Nature to Canvas • Plant cultivation • Artistic development</p><div class="toolbar"><button onclick="goToday()">Today</button><button onclick="changeMonth(-1)">‹ Previous</button><button onclick="changeMonth(1)">Next ›</button><button onclick="openGallery()">🎨 Art Gallery Mode</button><button onclick="addEvent()">＋ Add Activity</button></div><h2 id="month"></h2><div class="calendar" id="cal"></div></div>
<div class="music"><button onclick="prevSong()">⏮</button><button id="play" onclick="toggleMusic()">▶️</button><button onclick="nextSong()">⏭</button><select id="song" onchange="selectSong(this.value)"><option value="0">Song 1</option><option value="1">Song 2</option><option value="2">Song 3</option></select><span>🔊</span><input id="vol" type="range" min="0" max="1" step=".01" value=".55" oninput="audio.volume=this.value"></div>
<div id="gallery" class="gallery"><button class="exit" onclick="closeGallery()">✕ Exit Gallery</button><img id="art"><div class="name" id="artName"></div><div class="controls"><button onclick="prevArt()">⏮</button><button id="slide" onclick="toggleSlides()">▶️</button><button onclick="nextArt()">⏭</button> <label>Speed <input id="speed" type="range" min="2" max="15" value="6"></label></div></div>
<script>
const events=JSON.parse(localStorage.getItem('calendarEvents')||'[]');let view=new Date();
function render(){const y=view.getFullYear(),m=view.getMonth();month.textContent=view.toLocaleString('en',{month:'long',year:'numeric'});cal.innerHTML='';['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(x=>{const d=document.createElement('div');d.className='head';d.textContent=x;cal.appendChild(d)});const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){const d=document.createElement('div');d.className='day';d.style.visibility='hidden';cal.appendChild(d)}for(let n=1;n<=days;n++){const d=document.createElement('div');d.className='day';const date=`${y}-${String(m+1).padStart(2,'0')}-${String(n).padStart(2,'0')}`;if(date===new Date().toISOString().slice(0,10))d.classList.add('today');d.innerHTML='<b>'+n+'</b>';events.filter(e=>e.date===date).forEach(e=>{d.innerHTML+=`<div class="event">${e.title}</div>`});d.onclick=()=>addEvent(date);cal.appendChild(d)}}
function changeMonth(n){view.setMonth(view.getMonth()+n);render()}function goToday(){view=new Date();render()}function addEvent(date){const title=prompt('Activity / Event:');if(!title)return;const dt=date||prompt('Date (YYYY-MM-DD):');if(!dt)return;events.push({date:dt,title});localStorage.setItem('calendarEvents',JSON.stringify(events));render()}
const base='https://raw.githubusercontent.com/LarryElijah/Art-Gallery-Online/main/';const songs=[base+'amapiano.mp3',base+'Casapiano%20%5B7JDBiyDhZI8%5D.mp3',base+'Asake%20x%20Mavo%20Amapiano%20Type%20Beat%20_%20Afrobeat%20Instrumental%202026%20_AURA%20SALAD_%20%5B0PyPdLnchLQ%5D.mp3'];let si=0;const audio=new Audio(songs[0]);audio.volume=.55;audio.onended=nextSong;function toggleMusic(){if(audio.paused){audio.play().then(()=>play.textContent='⏸').catch(()=>{});}else{audio.pause();play.textContent='▶️'}}function loadSong(){audio.src=songs[si];song.value=si;audio.play().then(()=>play.textContent='⏸').catch(()=>{})}function nextSong(){si=(si+1)%songs.length;loadSong()}function prevSong(){si=(si-1+songs.length)%songs.length;loadSong()}function selectSong(v){si=Number(v);loadSong()}
const arts=[['IMG_0080.jpeg','Artwork 01'],['IMG_0081.jpeg','Artwork 02'],['IMG_0084.jpeg','Artwork 03']];let ai=0,slides=false,timer;function showArt(){art.src=base+arts[ai][0];artName.textContent=arts[ai][1]}function openGallery(){gallery.classList.add('show');showArt()}function closeGallery(){gallery.classList.remove('show');clearInterval(timer);slides=false;slide.textContent='▶️'}function nextArt(){ai=(ai+1)%arts.length;showArt()}function prevArt(){ai=(ai-1+arts.length)%arts.length;showArt()}function toggleSlides(){slides=!slides;slide.textContent=slides?'⏸':'▶️';clearInterval(timer);if(slides)timer=setInterval(nextArt,Number(speed.value)*1000)}speed.oninput=()=>{if(slides){clearInterval(timer);timer=setInterval(nextArt,Number(speed.value)*1000)}}
render();
</script></body></html>
