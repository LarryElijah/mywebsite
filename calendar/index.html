<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Project Calendar</title><style>body{margin:0;background:#080b10;color:#fff;font-family:Arial,sans-serif;text-align:center}main{padding:60px 20px}.btn{padding:12px 18px;margin:6px;border-radius:12px;border:1px solid #777;background:#171c25;color:#fff;cursor:pointer}.gallery{position:fixed;inset:0;background:#050608;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20}.gallery.show{display:flex}.gallery img{max-width:90%;max-height:68vh;object-fit:contain}.controls,.music{background:#111722;border-radius:16px;padding:10px}.music{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:30}.exit{position:absolute;top:15px;right:15px}.title{font-size:20px;margin:10px}input,select{vertical-align:middle}</style></head><body><main><h1>My Project Calendar</h1><p>From Nature to Canvas</p><button class="btn" onclick="openGallery()">🎨 Art Gallery Mode</button><p>Calendar activities and events remain available here.</p></main><div id="gallery" class="gallery"><button class="btn exit" onclick="closeGallery()">✕ Exit Gallery</button><img id="art" src=""><div class="title" id="artTitle"></div><div class="controls"><button class="btn" onclick="prevArt()">⏮</button><button class="btn" id="slideBtn" onclick="toggleSlides()">▶️</button><button class="btn" onclick="nextArt()">⏭</button><label> Speed <input id="speed" type="range" min="2" max="15" value="6"></label></div></div><div class="music"><button class="btn" onclick="prevSong()">⏮</button><button class="btn" id="play" onclick="toggleMusic()">▶️</button><button class="btn" onclick="nextSong()">⏭</button><select class="btn" id="song" onchange="selectSong(this.value)"><option value="0">Song 1</option><option value="1">Song 2</option><option value="2">Song 3</option></select><label> 🔊 <input id="vol" type="range" min="0" max="1" step=".01" value=".55" oninput="setVolume(this.value)"></label></div><script>const base='https://raw.githubusercontent.com/LarryElijah/Art-Gallery-Online/main/';const arts=[['IMG_0080.jpeg','Artwork 01'],['IMG_0081.jpeg','Artwork 02'],['IMG_0084.jpeg','Artwork 03']];let ai=0,slides=false,timer;function showArt(){art.src=base+arts[ai][0];artTitle.textContent=arts[ai][1]}function openGallery(){gallery.classList.add('show');showArt()}function closeGallery(){gallery.classList.remove('show');clearInterval(timer);slides=false;slideBtn.textContent='▶️'}function nextArt(){ai=(ai+1)%arts.length;showArt()}function prevArt(){ai=(ai-1+arts.length)%arts.length;showArt()}function toggleSlides(){slides=!slides;slideBtn.textContent=slides?'⏸':'▶️';clearInterval(timer);if(slides)timer=setInterval(nextArt,+speed.value*1000)}speed.oninput=()=>{if(slides){clearInterval(timer);timer=setInterval(nextArt,+speed.value*1000)}}const songs=[base+'amapiano.mp3',base+'Casapiano%20%5B7JDBiyDhZI8%5D.mp3',base+'Asake%20x%20Mavo%20Amapiano%20Type%20Beat%20_%20Afrobeat%20Instrumental%202026%20_AURA%20SALAD_%20%5B0PyPdLnchLQ%5D.mp3'];let si=0,audio=new Audio(songs[0]);audio.volume=.55;audio.onended=nextSong;function toggleMusic(){if(audio.paused){audio.play().then(()=>play.textContent='⏸').catch(()=>{});}else{audio.pause();play.textContent='▶️'}}function nextSong(){si=(si+1)%songs.length;loadSong()}function prevSong(){si=(si-1+songs.length)%songs.length;loadSong()}function loadSong(){audio.src=songs[si];song.value=si;audio.play().then(()=>play.textContent='⏸').catch(()=>{})}function selectSong(v){si=+v;loadSong()}function setVolume(v){audio.volume=+v}</script></body></html>
