<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Project Calendar</title><style>body{margin:0;background:#080b10;color:#fff;font-family:Arial,sans-serif;text-align:center}button,input{padding:10px;margin:6px;border-radius:10px;border:1px solid #555;background:#171c25;color:#fff}.gallery{position:fixed;inset:0;background:#050608;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:20}.gallery.show{display:flex}.gallery img{max-width:90%;max-height:72vh;object-fit:contain}.controls{padding:10px;background:#111722;border-radius:16px}.music{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:30;background:#111722;padding:10px 15px;border-radius:16px}.title{font-size:20px;margin:10px}.exit{position:absolute;top:15px;right:15px}</style></head><body><main><h1>My Project Calendar</h1><p>From Nature to Canvas</p><button onclick="openGallery()">🎨 Art Gallery Mode</button><p>Calendar activities and events remain available here.</p></main><div id="gallery" class="gallery"><button class="exit" onclick="closeGallery()">✕ Exit Gallery</button><img id="art" src=""><div class="title" id="artTitle"></div><div class="controls"><button onclick="prevArt()">⏮</button><button id="slideBtn" onclick="toggleSlides()">▶️</button><button onclick="nextArt()">⏭</button><label> Speed <input id="speed" type="range" min="2" max="15" value="6"></label></div></div><div class="music"><button onclick="prevSong()">⏮</button><button id="play" onclick="toggleMusic()">▶️</button><button onclick="nextSong()">⏭</button><select id="song" onchange="selectSong(this.value)"><option>Song 1</option><option>Song 2</option><option>Song 3</option></select><label>🔊 <input id="vol" type="range" min="0" max="1" step=".01" value=".55" oninput="setVolume(this.value)"></label></div><script>const arts=[['IMG_0080.jpeg','Artwork 01'],['IMG_0081.jpeg','Artwork 02'],['IMG_0084.jpeg','Artwork 03']];let ai=0,slides=false,timer;function showArt(){document.getElementById('art').src='https://raw.githubusercontent.com/LarryElijah/Art-Gallery-Online/main/'+arts[ai][0];document.getElementById('artTitle').textContent=arts[ai][1]}function openGallery(){document.getElementById('gallery').classList.add('show');showArt()}function closeGallery(){document.getElementById('gallery').classList.remove('show');clearInterval(timer);slides=false;document.getElementById('slideBtn').textContent='▶️'}function nextArt(){ai=(ai+1)%arts.length;showArt()}function prevArt(){ai=(ai-1+arts.length)%arts.length;showArt()}function toggleSlides(){slides=!slides;document.getElementById('slideBtn').textContent=slides?'⏸':'▶️';clearInterval(timer);if(slides)timer=setInterval(nextArt,+document.getElementById('speed').value*1000)}document.getElementById('speed').oninput=()=>{if(slides){clearInterval(timer);timer=setInterval(nextArt,+document.getElementById('speed').value*1000)}}const songs=['https://larryelijah.github.io/Art-Gallery-Online/amapiano.mp3','https://larryelijah.github.io/Art-Gallery-Online/Casapiano%20%5B7JDBiyDhZI8%5D.mp3','https://larryelijah.github.io/Art-Gallery-Online/Asake%20x%20Mavo%20Amapiano%20Type%20Beat%20_%20Afrobeat%20Instrumental%202026%20_AURA%20SALAD_%20%5B0PyPdLnchLQ%5D.mp3'];let si=0,audio=new Audio(songs[0]);audio.volume=.55;audio.onended=nextSong;function toggleMusic(){if(audio.paused){audio.play();document.getElementById('play').textContent='⏸'}else{audio.pause();document.getElementById('play').textContent='▶️'}}function nextSong(){si=(si+1)%songs.length;audio.src=songs[si];document.getElementById('song').value='Song '+(si+1);audio.play().catch(()=>{});document.getElementById('play').textContent='⏸'}function prevSong(){si=(si-1+songs.length)%songs.length;audio.src=songs[si];document.getElementById('song').value='Song '+(si+1);audio.play().catch(()=>{});document.getElementById('play').textContent='⏸'}function selectSong(v){si=+v.split(' ')[1]-1;audio.src=songs[si];audio.play().catch(()=>{});document.getElementById('play').textContent='⏸'}function setVolume(v){audio.volume=+v}</script></body></html>
