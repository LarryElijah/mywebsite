<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Larry's Project Calendar</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;color:#f5f2eb}body{background:#07090d;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-5;background:#07090d;overflow:hidden}.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease;filter:brightness(.62) saturate(.9)}.bg img.active{opacity:1}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,5,8,.42),rgba(3,5,8,.12),rgba(3,5,8,.42));backdrop-filter:blur(1px)}
.wrap{max-width:1180px;margin:auto;padding:30px 5vw 140px}header{display:flex;align-items:center;justify-content:space-between;padding:12px 0 24px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:38px}.brand{font-family:Georgia,serif;font-size:22px;letter-spacing:-.5px}.brand span{color:#e9c46a}.label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#e9c46a;font-weight:800}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(3.4rem,7vw,6.5rem);line-height:.9;letter-spacing:-5px;margin:12px 0 18px}h1 em{font-style:italic;color:#e9c46a}.sub{color:#d0d4dc;max-width:650px;line-height:1.7;font-size:15px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:30px 0 28px}.btn,select,input{font:inherit}.btn,select{background:rgba(16,20,28,.42);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:11px 16px;cursor:pointer;backdrop-filter:blur(16px);transition:.25s}.btn:hover,select:hover{border-color:#e9c46a;transform:translateY(-2px)}.calendar-shell{background:rgba(7,9,13,.22);border:1px solid rgba(255,255,255,.16);border-radius:22px;padding:22px;backdrop-filter:blur(16px);box-shadow:0 30px 90px rgba(0,0,0,.22)}#month{font-family:Georgia,serif;font-weight:400;font-size:32px;margin:4px 0 20px;color:#f5f2eb}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.head{text-align:center;color:#e9c46a;padding:10px;font-size:11px;text-transform:uppercase;letter-spacing:2px}.day{min-height:105px;background:rgba(16,20,28,.32);border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:10px;backdrop-filter:blur(10px);transition:.25s}.day:hover{background:rgba(16,20,28,.48);border-color:rgba(233,196,106,.38);transform:translateY(-2px)}.today{border:1px solid #e9c46a;box-shadow:inset 0 0 0 1px rgba(233,196,106,.18)}.event{margin-top:7px;padding:7px;background:rgba(233,196,106,.14);border-left:2px solid #e9c46a;border-radius:7px;font-size:12px;color:#f8e8b5}
.music{position:fixed;bottom:20px;right:22px;z-index:30;background:rgba(16,20,28,.72);border:1px solid rgba(255,255,255,.18);padding:11px;border-radius:16px;display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center;backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.3)}.music .btn{padding:8px 11px}
.gallery{position:fixed;inset:0;background:rgba(3,4,5,.94);z-index:50;display:none;align-items:center;justify-content:center;flex-direction:column;padding:25px}.gallery.show{display:flex}.gallery img{max-width:90vw;max-height:70vh;object-fit:contain}.gallery .name{font:22px Georgia,serif;margin:12px}.controls{background:rgba(16,20,28,.82);padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(16px)}.exit{position:absolute;right:18px;top:18px}
@media(max-width:650px){h1{font-size:3.5rem;letter-spacing:-3px}.wrap{padding:22px 18px 140px}.day{min-height:70px;padding:7px}.calendar-shell{padding:12px;border-radius:17px}.music{left:12px;right:12px;bottom:12px}.brand{font-size:18px}}
</style>
</head>
<body>
<div class="bg" id="background"></div>
<div class="wrap"><header><div class="brand">Larry <span>×</span> Project Calendar</div><div class="label">From Nature to Canvas</div></header><div class="label">PLANNING • CULTIVATION • CREATIVE EXPRESSION</div><h1>My Project <em>Calendar</em></h1><p class="sub">Plan and document plant cultivation, artistic development, deadlines, activities and important project moments in one visual workspace.</p><div class="toolbar"><button class="btn" id="todayBtn">Today</button><button class="btn" id="prevMonth">‹ Previous</button><button class="btn" id="nextMonth">Next ›</button><button class="btn" id="galleryBtn">🎨 Art Gallery Mode</button><button class="btn" id="addBtn">＋ Add Activity</button></div><div class="calendar-shell"><h2 id="month"></h2><div class="calendar" id="cal"></div></div></div>
<div class="music"><button class="btn" id="prevSong">⏮</button><button class="btn" id="playSong">▶️</button><button class="btn" id="nextSong">⏭</button><select id="songSelect"><option value="0">Song 1</option><option value="1">Song 2</option><option value="2">Song 3</option></select><span>🔊</span><input id="volume" type="range" min="0" max="1" step=".01" value=".55"></div>
<div id="gallery" class="gallery"><button class="btn exit" id="exitGallery">✕ Exit Gallery</button><img id="art" alt="Artwork"><div class="name" id="artName"></div><div class="controls"><button class="btn" id="prevArt">⏮</button><button class="btn" id="slideBtn">▶️</button><button class="btn" id="nextArt">⏭</button> <label>Speed <input id="speed" type="range" min="2" max="15" value="6"></label></div></div>
<script>
(function(){const $=id=>document.getElementById(id);const base='https://raw.githubusercontent.com/LarryElijah/Art-Gallery-Online/main/';const arts=[['IMG_0080.jpeg','Artwork 01'],['IMG_0081.jpeg','Artwork 02'],['IMG_0084.jpeg','Artwork 03']];const bg=$('background');arts.forEach((a,i)=>{const im=document.createElement('img');im.src=base+a[0];im.alt='';if(i===0)im.className='active';bg.appendChild(im)});let bi=0;setInterval(()=>{const imgs=bg.querySelectorAll('img');imgs[bi].classList.remove('active');bi=(bi+1)%imgs.length;imgs[bi].classList.add('active')},8000);
const events=JSON.parse(localStorage.getItem('natureCanvasEvents')||'[]');let view=new Date();function render(){const y=view.getFullYear(),m=view.getMonth();$('month').textContent=view.toLocaleString('en',{month:'long',year:'numeric'});const c=$('cal');c.innerHTML='';['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(x=>{const h=document.createElement('div');h.className='head';h.textContent=x;c.appendChild(h)});const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){const e=document.createElement('div');e.className='day';e.style.visibility='hidden';c.appendChild(e)}for(let n=1;n<=days;n++){const d=document.createElement('div');d.className='day';const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(n).padStart(2,'0');if(ds===new Date().toISOString().slice(0,10))d.classList.add('today');d.innerHTML='<b>'+n+'</b>';events.filter(e=>e.date===ds).forEach(e=>{const x=document.createElement('div');x.className='event';x.textContent=e.title;d.appendChild(x)});d.onclick=()=>addEvent(ds);c.appendChild(d)}}function addEvent(date){const title=prompt('Activity / Event:');if(!title)return;const dt=date||prompt('Date (YYYY-MM-DD):');if(!dt)return;events.push({date:dt,title:title});localStorage.setItem('natureCanvasEvents',JSON.stringify(events));render()}$('todayBtn').onclick=()=>{view=new Date();render()};$('prevMonth').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('nextMonth').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('addBtn').onclick=()=>addEvent();
const songs=[base+'amapiano.mp3',base+'Casapiano%20%5B7JDBiyDhZI8%5D.mp3',base+'Asake%20x%20Mavo%20Amapiano%20Type%20Beat%20_%20Afrobeat%20Instrumental%202026%20_AURA%20SALAD_%20%5B0PyPdLnchLQ%5D.mp3'];let si=0;const audio=new Audio();audio.volume=.55;function loadSong(auto){audio.src=songs[si];$('songSelect').value=si;if(auto)audio.play().then(()=>{$('playSong').textContent='⏸'}).catch(()=>{});else $('playSong').textContent='▶️'}function nextSong(){si=(si+1)%songs.length;loadSong(true)}function prevSong(){si=(si-1+songs.length)%songs.length;loadSong(true)}audio.onended=nextSong;$('playSong').onclick=()=>{if(audio.paused){audio.play().then(()=>{$('playSong').textContent='⏸'}).catch(()=>{})}else{audio.pause();$('playSong').textContent='▶️'}};$('nextSong').onclick=nextSong;$('prevSong').onclick=prevSong;$('songSelect').onchange=e=>{si=Number(e.target.value);loadSong(true)};$('volume').oninput=e=>audio.volume=Number(e.target.value);loadSong(false);
let ai=0,slides=false,timer=null;function showArt(){$('art').src=base+arts[ai][0];$('artName').textContent=arts[ai][1]}function nextArt(){ai=(ai+1)%arts.length;showArt()}function prevArt(){ai=(ai-1+arts.length)%arts.length;showArt()}function stopSlides(){clearInterval(timer);timer=null;slides=false;$('slideBtn').textContent='▶️'}$('galleryBtn').onclick=()=>{$('gallery').classList.add('show');showArt()};$('exitGallery').onclick=()=>{$('gallery').classList.remove('show');stopSlides()};$('nextArt').onclick=nextArt;$('prevArt').onclick=prevArt;$('slideBtn').onclick=()=>{if(slides)stopSlides();else{slides=true;$('slideBtn').textContent='⏸';timer=setInterval(nextArt,Number($('speed').value)*1000)}};$('speed').oninput=()=>{if(slides){clearInterval(timer);timer=setInterval(nextArt,Number($('speed').value)*1000)}};render()})();
</script></body></html>
