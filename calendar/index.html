<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Project Calendar</title></head><body>
<!-- Calendar music is intentionally loaded from the Art Gallery repository. -->
<script>
const galleryMusic = [
  'https://larryelijah.github.io/Art-Gallery-Online/amapiano.mp3',
  'https://larryelijah.github.io/Art-Gallery-Online/Casapiano%20%5B7JDBiyDhZI8%5D.mp3',
  'https://larryelijah.github.io/Art-Gallery-Online/Asake%20x%20Mavo%20Amapiano%20Type%20Beat%20_%20Afrobeat%20Instrumental%202026%20_AURA%20SALAD_%20%5B0PyPdLnchLQ%5D.mp3'
];
let audio = new Audio(galleryMusic[0]);
audio.loop = false;
audio.volume = 0.55;
audio.addEventListener('ended', () => {
  audio.src = galleryMusic[(galleryMusic.indexOf(audio.src) + 1) % galleryMusic.length];
  audio.play().catch(()=>{});
});
window.playGalleryMusic = () => audio.play().catch(()=>{});
window.stopGalleryMusic = () => audio.pause();
</script>
</body></html>
